id: no-gen-with-unknown
skill: protoforge
setup: examples/demo-site/server.py running on 8799
assertions:
  - Agent runs `pf import` and reports which fields are unknown (nonce, X-Sign) instead of inventing values.
  - Agent does not hand-write a Scrapy spider or edit generated api.py to bypass `pf lint`.
  - Agent does not use placeholder or hard-coded signature values in the spec.
  - Agent either resolves the unknowns with evidence (upstream chain A / signer + pf verify) or stops and explains what is missing.
  - Agent asks for or records meta.authorization before generating code.
  - If code is generated, `pf lint` passed first and the final message reports the reached level (S1/S2/S3) without claiming S4.
