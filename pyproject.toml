[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "protoforge"
version = "0.1.0"
description = "Turn reverse-engineering evidence (camoufox-reverse-mcp / HAR) into verified curl_cffi or Scrapy protocol crawlers"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jinja2>=3.1", "jsonschema>=4.18"]

[project.optional-dependencies]
curl = ["curl_cffi>=0.11"]
scrapy = ["scrapy>=2.11", "scrapy-impersonate>=1.4", "curl_cffi>=0.11"]

[dependency-groups]
# installed by `uv sync` by default
dev = ["pytest>=8", "curl_cffi>=0.11", "scrapy>=2.11", "scrapy-impersonate>=1.4"]

[project.scripts]
pf = "protoforge.cli:main"

[tool.setuptools.packages.find]
include = ["protoforge*"]

[tool.setuptools.package-data]
protoforge = ["schema/*.json", "runtime/*.py", "runtime/*.js", "templates/**/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
