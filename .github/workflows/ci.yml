name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: |
          uv run pf lint examples/demo/spec.yaml
          uv run pf verify examples/demo/spec.yaml --fixtures examples/demo/fixtures/demo.fixtures.json
